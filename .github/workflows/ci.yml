# Tests on every push and pull request; publishes to GitHub Pages only when
# main is green. The game is static, so "build" is just copying the repo.
#
# ONE MANUAL STEP, once, before the first deploy can succeed:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# configure-pages can in principle switch this on itself with enablement: true,
# but creating a Pages site is not something the default GITHUB_TOKEN is allowed
# to do ("Resource not accessible by integration"), so it has to be a click.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# only the newest run of a branch matters; cancel the ones it overtook
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # no package.json on purpose: the game has no dependencies at all, and
      # the two dev tools are installed here rather than vendored into it
      - name: Install dev tooling
        run: npm install --no-save playwright eslint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint .

      - name: Every mission is vocalised
        run: node tools/vocalize.js --check

      - name: Every news mission is well formed
        run: node tools/news-add.js --check

      - name: Smoke test the real game in a browser
        run: node tests/smoke.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # a job-level block replaces the defaults outright, so contents: read has
      # to be restated here or actions/checkout cannot see the repository
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp the commit onto every asset URL. index.html may be cached by the
      # browser, but a cached page then pulls cached scripts, so a deploy could
      # go unseen; a URL that changes with the commit cannot be served stale,
      # and version.json lets a page that IS stale notice and reload itself.
      - name: Stamp the build id
        run: |
          SHA="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=$SHA/g" index.html
          printf '{"build":"%s"}\n' "$SHA" > version.json
          grep -c "?v=$SHA" index.html
          cat version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

# Tests on every push and pull request; publishes to GitHub Pages only when
# main is green. The game is static, so "build" is just copying the repo.
#
# The deploy job turns Pages on by itself on its first run (enablement: true),
# so there is nothing to switch on by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# only the newest run of a branch matters; cancel the ones it overtook
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # no package.json on purpose: the game has no dependencies at all, and
      # the two dev tools are installed here rather than vendored into it
      - name: Install dev tooling
        run: npm install --no-save playwright eslint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint .

      - name: Every mission is vocalised
        run: node tools/vocalize.js --check

      - name: Smoke test the real game in a browser
        run: node tests/smoke.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # a job-level block replaces the defaults outright, so contents: read has
      # to be restated here or actions/checkout cannot see the repository
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on through the API on the first run, so the
      # repository does not have to be configured by hand beforehand
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
